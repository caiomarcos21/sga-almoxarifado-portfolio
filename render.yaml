databases:
  - name: sga-db
    plan: free
    databaseName: almoxarifado
    user: sga_admin

services:
  - type: web
    name: sga-almoxarifado-enel
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: sga-db
          property: connectionString
